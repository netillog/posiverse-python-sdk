[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posiverse"
version = "0.1.0"
description = "Python SDK for the Posiverse OpenAPI (httpx + pydantic v2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Netillo Granados" },
]
keywords = ["posiverse", "iot", "openapi", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "idna>=3.15",
  # httpx depends on anyio. 4.12.1 is the newest release that installs on
  # Python 3.9, and pip-audit flags it (GHSA-82r6-8w77-94w6, GHSA-5p39-cfhj-2xmp).
  # The fix is anyio>=4.14.2, which requires Python >=3.10.
  "anyio>=4.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/posiverse"]

# Publish surface. Hatchling also force-includes pyproject.toml (and the
# configured readme and license files). Contributor trees stay on develop
# and are not listed here, so they are not shipped in the sdist.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["posiverse"]
