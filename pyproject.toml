[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posiverse"
version = "0.1.0"
description = "Python SDK for the Posiverse OpenAPI (httpx + pydantic v2)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Netillo Granados" },
]
keywords = ["posiverse", "iot", "openapi", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "idna>=3.15",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.6",
]
dev = [
  "posiverse[test]",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/netillog/posiverse-python-sdk"
Repository = "https://github.com/netillog/posiverse-python-sdk"
Documentation = "https://openapi-prod.posiverse.com"
Changelog = "https://github.com/netillog/posiverse-python-sdk/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/posiverse"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/openapi",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/RELEASE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: optional live tests; require POSIVERSE_BASE_URL and refuse production (excluded by default)",
]
addopts = ["-m", "not live"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["posiverse"]
