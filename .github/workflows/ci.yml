name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # PYSEC-2026-3447 is fixed in setuptools 83, which requires Python 3.10+.
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
            python -m pip install --upgrade "setuptools>=83"
          else
            python -m pip install --upgrade setuptools
          fi
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Refuse test host in published library sources
        run: |
          if grep -R --include='*.py' -n "openapi-test.posiverse.com" src; then
            echo "Test OpenAPI hostname must not appear in library source" >&2
            exit 1
          fi

      - name: Run unit tests (mocked; no secrets; live marker excluded)
        run: pytest -q -m "not live"

      - name: Build wheel and confirm it omits the test host
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path

          needle = b"openapi-test.posiverse.com"
          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  for name in archive.namelist():
                      data = archive.read(name)
                      if needle in data:
                          raise SystemExit(f"test OpenAPI hostname found in {wheel.name}:{name}")
          print("wheel omits test OpenAPI hostname")
          PY

      - name: Audit installed package dependencies
        run: |
          # Re-apply the patched toolchain in case later steps changed it.
          # Full environment audit; skip only the unpublished local editable.
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
            python -m pip install --upgrade "setuptools>=83"
            pip-audit --skip-editable --progress-spinner off
          else
            # PYSEC-2026-3447 is fixed in setuptools 83, which requires Python 3.10+.
            python -m pip install --upgrade setuptools
            pip-audit --skip-editable --progress-spinner off --ignore-vuln PYSEC-2026-3447
          fi
